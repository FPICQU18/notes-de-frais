map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # Résolution paresseuse : « backend » n'est résolu qu'au premier proxy_pass,
    # jamais au chargement de la configuration. Le conteneur web démarre donc
    # même si le backend n'est pas encore prêt. 127.0.0.11 est le DNS embarqué
    # de Docker (à adapter sur un autre orchestrateur).
    resolver 127.0.0.11 valid=30s;
    # Pas d'URI dans la variable (sans « / ») : le chemin d'origine est conservé.
    set $backend http://backend:8000;

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # L'API est transmise telle quelle : pas de try_files (une erreur du backend
    # reste une erreur du backend, jamais index.html), aucun en-tête de cache, et
    # des corps autorisés jusqu'à 10 Mo (limite des justificatifs).
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 10m;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
