<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>B · Ticket scanné</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2FD6}a:hover{color:#3A22B0}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1A2E; overflow: hidden">
  <header style="height: 64px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: 0; border-radius: 16px; background: #F3F4FF; color: #1A1A2E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <h1 style="margin: 0; font-size: 17px; font-weight: 800">Nouvelle dépense</h1>
    <span aria-hidden="true" style="width: 44px"></span>
  </header>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 4px">
      <div role="img" aria-label="Photo du ticket" style="width: 64px; height: 84px; border-radius: 14px; background: repeating-linear-gradient(135deg, #EEF0FF 0 7px, #E1E4FF 7px 14px); transform: rotate(-4deg)"></div>
      <span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #EDE9FF; color: #3A22B0; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path></svg>Rempli depuis le ticket</span>
      <label for="b-montant" style="font-size: 13px; font-weight: 600; color: #565A73">Montant</label>
      <input id="b-montant" inputmode="decimal" value="24,50 €" style="width: 220px; border: 0; text-align: center; font: 800 44px 'Plus Jakarta Sans', sans-serif; letter-spacing: -0.03em; color: #1A1A2E; font-variant-numeric: tabular-nums; background: transparent">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="b-libelle" style="font-size: 13px; font-weight: 700; color: #565A73">Libellé</label>
      <input id="b-libelle" value="Restaurant Le Comptoir" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 18px; padding: 0 16px; background: #F3F4FF; font: 600 16px 'Plus Jakarta Sans', sans-serif; color: #1A1A2E">
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="b-date" style="font-size: 13px; font-weight: 700; color: #565A73">Date</label>
      <input id="b-date" value="Mercredi 18 novembre" style="height: 52px; box-sizing: border-box; border: 0; border-radius: 18px; padding: 0 16px; background: #F3F4FF; font: 600 16px 'Plus Jakarta Sans', sans-serif; color: #1A1A2E">
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700; color: #565A73">Catégorie</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button style="height: 64px; border: 0; border-radius: 18px; background: #F3F4FF; color: #1A1A2E; font: 600 12px 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="14" rx="3"></rect><path d="M8 21l2-3M16 21l-2-3M6 11h12"></path></svg>Transport</button>
        <button aria-pressed="true" style="height: 64px; border: 0; border-radius: 18px; background: #5B3DF5; color: #FFFFFF; font: 700 12px 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"></path></svg>Repas</button>
        <button style="height: 64px; border: 0; border-radius: 18px; background: #F3F4FF; color: #1A1A2E; font: 600 12px 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V7M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6"></path><circle cx="7" cy="11" r="2"></circle></svg>Hôtel</button>
        <button style="height: 64px; border: 0; border-radius: 18px; background: #F3F4FF; color: #1A1A2E; font: 600 12px 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle></svg>Autres</button>
      </div>
    </fieldset>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; background: #FFFFFF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="height: 56px; border: 0; border-radius: 20px; background: #F3F4FF; color: #1A1A2E; font: 700 15px 'Plus Jakarta Sans', sans-serif">À classer</button>
    <button style="height: 56px; border: 0; border-radius: 20px; background: #5B3DF5; color: #FFFFFF; font: 700 15px 'Plus Jakarta Sans', sans-serif">Ajouter à Sem. 47</button>
  </div>
</div>

</body>
</html>
