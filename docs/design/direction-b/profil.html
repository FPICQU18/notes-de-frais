<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B · Profil</title>
<style>
:root{--fond:#F3F4FF;--carte:#FFFFFF;--texte:#1A1A2E;--texte2:#565A73;--primaire:#5B3DF5;--pale:#EDE9FF;--pale-texte:#3A22B0;--ombre:0 6px 18px rgba(40,30,120,.06);--ombre-bouton:0 10px 24px rgba(91,61,245,.35)}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:var(--texte);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit;text-decoration:none}
.titre-page{font-size:20px;font-weight:800;margin:24px 20px 4px}.note-page{font-size:13px;color:var(--texte2);margin:0 20px 10px;max-width:920px;line-height:1.5}
.planche{display:flex;flex-wrap:wrap;gap:28px;padding:16px 20px 56px;align-items:flex-start}
figure{margin:0}figcaption{width:390px;font-size:13px;font-weight:700;color:var(--texte2);margin-bottom:8px}
.ecran{position:relative;width:390px;height:844px;background:var(--fond);overflow:hidden;box-shadow:var(--ombre)}
.zone{padding:4px 20px 0}
.h{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.mini{font-size:13px;color:var(--texte2);margin:0}
.pastille{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.role{background:var(--pale);color:var(--pale-texte)}
.carte{background:var(--carte);border-radius:24px;box-shadow:var(--ombre);padding:26px 20px;text-align:center}
.avatar-lg{width:72px;height:72px;border-radius:24px;background:var(--pale);color:var(--pale-texte);font-size:24px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.nom{font-size:20px;font-weight:800;margin:14px 0 4px}
.rubrique{font-size:13px;font-weight:700;color:var(--texte2);margin:22px 0 8px}
.carte-ligne{background:var(--carte);border-radius:20px;box-shadow:var(--ombre);min-height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;font-family:inherit;font-size:15px;font-weight:700;height:56px;width:100%}
.btn-secondaire{background:var(--carte);color:var(--texte)}
.btn:disabled{background:var(--carte);color:var(--texte2)}
.nav{position:absolute;left:16px;right:16px;bottom:20px;height:68px;border-radius:26px;background:#FFFFFF;box-shadow:0 10px 30px rgba(40,30,120,.12);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
.nav a{height:52px;display:flex;align-items:center;justify-content:center;color:var(--texte2)}
.nav a[aria-current="page"]{color:var(--primaire)}
.nav .plus{display:flex;justify-content:center}.nav .plus a{width:56px;height:56px;margin-top:-26px;border-radius:20px;background:var(--primaire);color:#FFFFFF;box-shadow:var(--ombre-bouton)}
</style>
</head>
<body>
<h1 class="titre-page">Profil (390 × 844)</h1>
<p class="note-page">Avatar à initiales, nom, e-mail, rôle en pastille, puis la sortie de session. Zones cliquables ≥ 44 px (ligne « Gérer les comptes » 56 px, bouton 56 px). Le lien d'administration n'apparaît que pour le rôle <code>admin</code>.</p>
<div class="planche">

<figure>
<figcaption>1 · Profil — rôle « utilisateur », onglet Profil actif</figcaption>
<div class="ecran">
  <div class="zone" style="padding-top:28px">
    <h2 class="h">Profil</h2>
    <div class="carte" style="margin-top:20px">
      <span class="avatar-lg" aria-hidden="true">CM</span>
      <p class="nom">Camille Moreau</p>
      <p class="mini" style="font-size:14px">camille.moreau@exemple.fr</p>
      <p style="margin:12px 0 0"><span class="pastille role">Utilisateur</span></p>
    </div>
    <p class="mini" style="margin-top:16px;line-height:1.5">Votre compte est créé et géré par un administrateur.</p>
    <button type="button" class="btn btn-secondaire" style="margin-top:24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>Se déconnecter</button>
  </div>
  <nav class="nav" aria-label="Navigation principale">
    <a href="#" aria-label="Accueil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#" aria-label="Dépenses"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></a>
    <div class="plus"><a href="#" aria-label="Ajouter une dépense"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div>
    <a href="#" aria-label="Dossiers"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#" aria-label="Profil" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></a>
  </nav>
</div>
</figure>

<figure>
<figcaption>2 · Profil — rôle « admin », lien « Gérer les comptes » (barre de navigation : onglet Validation)</figcaption>
<div class="ecran">
  <div class="zone" style="padding-top:28px">
    <h2 class="h">Profil</h2>
    <div class="carte" style="margin-top:20px">
      <span class="avatar-lg" aria-hidden="true">CM</span>
      <p class="nom">Camille Moreau</p>
      <p class="mini" style="font-size:14px">camille.moreau@exemple.fr</p>
      <p style="margin:12px 0 0"><span class="pastille role">Administrateur</span></p>
    </div>
    <p class="rubrique">Administration</p>
    <a class="carte-ligne" href="#"><span aria-hidden="true" style="display:flex;color:var(--pale-texte)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M2 21c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21c0-2.5-1-4-3-5"/></svg></span><span style="flex:1">Gérer les comptes</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <button type="button" class="btn btn-secondaire" style="margin-top:24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>Se déconnecter</button>
  </div>
  <nav class="nav" aria-label="Navigation principale">
    <a href="#" aria-label="Accueil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#" aria-label="Dépenses"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></a>
    <div class="plus"><a href="#" aria-label="Ajouter une dépense"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div>
    <a href="#" aria-label="Dossiers"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#" aria-label="Validation"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></a>
  </nav>
</div>
</figure>

<figure>
<figcaption>3 · Déconnexion en cours — bouton désactivé, <code>aria-busy="true"</code></figcaption>
<div class="ecran">
  <div class="zone" style="padding-top:28px">
    <h2 class="h">Profil</h2>
    <div class="carte" style="margin-top:20px">
      <span class="avatar-lg" aria-hidden="true">CM</span>
      <p class="nom">Camille Moreau</p>
      <p class="mini" style="font-size:14px">camille.moreau@exemple.fr</p>
      <p style="margin:12px 0 0"><span class="pastille role">Utilisateur</span></p>
    </div>
    <button type="button" class="btn" style="margin-top:24px" disabled aria-busy="true">Déconnexion…</button>
    <p class="mini" role="status" style="margin-top:10px;text-align:center">Fermeture de la session…</p>
  </div>
  <nav class="nav" aria-label="Navigation principale">
    <a href="#" aria-label="Accueil"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#" aria-label="Dépenses"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></a>
    <div class="plus"><a href="#" aria-label="Ajouter une dépense"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div>
    <a href="#" aria-label="Dossiers"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#" aria-label="Profil" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></a>
  </nav>
</div>
</figure>

</div>
</body>
</html>
