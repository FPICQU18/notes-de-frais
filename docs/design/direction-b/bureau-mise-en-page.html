<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau — Mise en page générale</title>
<style>
:root{
  --fond:#F3F4FF;
  --carte:#FFFFFF;
  --texte:#1A1A2E;
  --texte2:#565A73;
  --primaire:#5B3DF5;
  --pale:#EDE9FF;
  --pale-texte:#3A22B0;
  --err-fond:#FFE4E6;
  --err-texte:#9F1239;
  --ombre:0 6px 18px rgba(40,30,120,.06);
  --ombre-bouton:0 10px 24px rgba(91,61,245,.35);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  margin:0;
  background:var(--fond);
  color:var(--texte);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px;
  line-height:1.5;
}

a{
  color:inherit;
  text-decoration:none;
}

/* Barre latérale */
.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:280px;
  height:100vh;
  background:var(--carte);
  border-right:1px solid rgba(0,0,0,0.05);
  padding:24px 20px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

.sidebar-logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.sidebar-logo-icon{
  width:46px;
  height:46px;
  border-radius:23px;
  background:#FFD9C2;
  color:#7A3410;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:16px;
}

.sidebar-nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.sidebar-nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  border-radius:18px;
  color:var(--texte2);
  font-weight:700;
  font-size:15px;
  transition:background 0.2s;
}

.sidebar-nav-item:hover{
  background:rgba(91,61,245,0.08);
}

.sidebar-nav-item.active{
  background:var(--pale);
  color:var(--pale-texte);
}

.sidebar-nav-item .icon{
  width:24px;
  height:24px;
  stroke-width:2;
}

.sidebar-validation-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  min-height:20px;
  padding:0 6px;
  border-radius:999px;
  background:var(--primaire);
  color:#FFFFFF;
  font-size:11px;
  font-weight:700;
  position:absolute;
  top:8px;
  right:8px;
}

.sidebar-new-expense{
  margin-top:auto;
  padding:12px 16px;
  background:var(--primaire);
  color:#FFFFFF;
  border:0;
  border-radius:18px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

/* Zone de contenu */
.content{
  margin-left:280px;
  min-height:100vh;
  padding:40px 40px 60px;
  display:flex;
  flex-direction:column;
  gap:28px;
}

.content-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.content-title{
  font-size:28px;
  font-weight:800;
  color:var(--texte);
}

.content-subtitle{
  font-size:15px;
  color:var(--texte2);
}

/* Carte de dépense (formulaire) */
.expense-card{
  background:var(--carte);
  border-radius:24px;
  box-shadow:var(--ombre);
  padding:28px;
  max-width:640px;
  margin:0 auto;
  width:100%;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-bottom:20px;
}

.form-label{
  font-size:13px;
  font-weight:700;
  color:var(--texte);
}

.form-input,
.form-select{
  height:52px;
  padding:0 16px;
  border:0;
  border-radius:18px;
  background:var(--fond);
  font-family:inherit;
  font-size:15px;
  font-weight:500;
  color:var(--texte);
}

.form-input:focus,
.form-select:focus{
  outline:2px solid var(--primaire);
  outline-offset:2px;
}

.btn-primaire{
  height:56px;
  background:var(--primaire);
  color:#FFFFFF;
  border:0;
  border-radius:18px;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn-primaire:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

/* Responsive : mobile */
@media (max-width:1023px){
  .sidebar{
    display:none;
  }
  
  .content{
    margin-left:0;
    padding:20px 20px 88px;
  }
}

/* Variables pour les icônes */
@import url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>') {
  --icon-home: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>');
  --icon-depenses: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>');
  --icon-dossiers: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>');
  --icon-validation: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>');
  --icon-profil: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>');
  --icon-plus: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>');
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon" aria-hidden="true">CM</div>
    <div>
      <h2 style="font-size:18px;font-weight:800;margin:0">Camille Moreau</h2>
      <p style="font-size:13px;color:var(--texte2);margin:0">Comptable</p>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Navigation principale">
    <a href="#" class="sidebar-nav-item active">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-home"></use></svg>
      Accueil
    </a>
    <a href="#" class="sidebar-nav-item">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-depenses"></use></svg>
      Dépenses
    </a>
    <button class="sidebar-new-expense" aria-label="Nouvelle dépense">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nouvelle dépense
    </button>
    <a href="#" class="sidebar-nav-item">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-dossiers"></use></svg>
      Dossiers
    </a>
    <a href="#" class="sidebar-nav-item">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-validation"></use></svg>
      Validation
      <span class="sidebar-validation-badge">3</span>
    </a>
    <a href="#" class="sidebar-nav-item">
      <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-profil"></use></svg>
      Profil
    </a>
  </nav>
</div>

<div class="content">
  <div class="content-header">
    <div>
      <h1 class="content-title">Accueil</h1>
      <p class="content-subtitle">Bienvenue dans votre espace de travail</p>
    </div>
  </div>

  <div class="expense-card">
    <h2 style="font-size:20px;font-weight:800;margin-bottom:20px">Nouvelle dépense</h2>
    
    <div class="form-group">
      <label class="form-label" for="libelle">Libellé</label>
      <input type="text" id="libelle" class="form-input" placeholder="Exemple : Restaurant client">
    </div>

    <div class="form-group">
      <label class="form-label" for="date">Date de dépense</label>
      <input type="date" id="date" class="form-input" value="2026-11-26">
    </div>

    <div class="form-group">
      <label class="form-label" for="categorie">Catégorie</label>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">
        <button style="background:#E4E7FF;color:#3A22B0;border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;height:64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="14" rx="3"></rect><path d="M8 21l2-3M16 21l-2-3M6 11h12"></path></svg><span>Repas</span></button>
        <button style="background:#DDF6E8;color:#146C3C;border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;height:64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"></path></svg><span>Hébergement</span></button>
        <button style="background:#E0F2FE;color:#075985;border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;height:64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg><span>Transport</span></button>
        <button style="background:#FFF1D6;color:#7A4A00;border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;height:64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span>Carburant</span></button>
        <button style="background:#DDF6E8;color:#146C3C;border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;height:64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg><span>Péage</span></button>
        <button style="background:#F1F2F6;color:#565A73;border:0;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer;height:64px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Autre</span></button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="montant">Montant (€)</label>
      <input type="text" id="montant" class="form-input" placeholder="0,00" style="font-variant-numeric:tabular-nums">
    </div>

    <div class="form-group">
      <label class="form-label" for="commentaire">Commentaire (optionnel)</label>
      <input type="text" id="commentaire" class="form-input" placeholder="Détails supplémentaires">
    </div>

    <button class="btn-primaire" style="width:100%;margin-top:20px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Enregistrer la dépense
    </button>
  </div>
</div>

</body>
</html>
