<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>B · Dossier</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4A2FD6}a:hover{color:#3A22B0}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #F3F4FF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1A1A2E; overflow: hidden">
  <header style="height: 64px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between">
    <button aria-label="Retour" style="width: 44px; height: 44px; border: 0; border-radius: 16px; background: #FFFFFF; color: #1A1A2E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <span style="padding: 6px 12px; border-radius: 999px; background: #FFF1D6; color: #7A4A00; font-size: 13px; font-weight: 700">Brouillon</span>
  </header>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Semaine 47</h1>
      <p style="margin: 0; font-size: 14px; color: #565A73">3 dépenses · Déplacement à Lyon</p>
    </div>

    <div style="background: #FFFFFF; border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 6px 18px rgba(40,30,120,0.06)">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <p style="margin: 0; font-size: 14px; font-weight: 600; color: #565A73">Total</p>
        <p style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">180,00 €</p>
      </div>
      <div aria-hidden="true" style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 3px">
        <span style="flex: 89; background: #9C8BFF"></span>
        <span style="flex: 79; background: #5B3DF5"></span>
        <span style="flex: 12; background: #3FC98A"></span>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; font-weight: 600; color: #565A73">
        <li style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #9C8BFF"></span>Hôtel 89 €</li>
        <li style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #5B3DF5"></span>Transport 79 €</li>
        <li style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #3FC98A"></span>Parking 12 €</li>
      </ul>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="background: #FFFFFF; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 16px; background: #E4E7FF; color: #3A22B0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="14" rx="3"></rect><path d="M8 21l2-3M16 21l-2-3M6 11h12"></path></svg></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px"><p style="margin: 0; font-size: 15px; font-weight: 700">Train Paris → Lyon</p><p style="margin: 0; font-size: 13px; color: #565A73">17 nov.</p></div>
        <p style="margin: 0; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">79,00 €</p>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 16px; background: #DDF6E8; color: #146C3C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"></path></svg></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px"><p style="margin: 0; font-size: 15px; font-weight: 700">Parking Part-Dieu</p><p style="margin: 0; font-size: 13px; color: #565A73">17 nov.</p></div>
        <p style="margin: 0; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">12,00 €</p>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 16px; background: #EFEAFF; color: #4A2FD6; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V7M3 14h18v4M21 14v-3a3 3 0 0 0-3-3h-7v6"></path><circle cx="7" cy="11" r="2"></circle></svg></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 3px"><p style="margin: 0; font-size: 15px; font-weight: 700">Hôtel de la Gare</p><p style="margin: 0; font-size: 13px; color: #9A3F0B; font-weight: 700">Ticket manquant</p></div>
        <p style="margin: 0; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">89,00 €</p>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 28px; display: flex; gap: 10px">
    <button aria-label="Ajouter une dépense au dossier" style="width: 56px; height: 56px; flex: none; border: 0; border-radius: 20px; background: #FFFFFF; color: #1A1A2E; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(40,30,120,0.08)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button style="flex: 1; height: 56px; border: 0; border-radius: 20px; background: #5B3DF5; color: #FFFFFF; font: 700 16px 'Plus Jakarta Sans', sans-serif; box-shadow: 0 10px 24px rgba(91,61,245,0.30)">Envoyer pour validation</button>
  </div>
</div>

</body>
</html>
